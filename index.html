<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#14110d">
<title>Pino Coiffeur — Parrucchiere</title>
<meta name="description" content="Pino Coiffeur: taglio classico e stile moderno a Cropani Marina e Scandale. Salva il contatto, scrivi su WhatsApp o vieni a trovarci.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14110d;
    --surface:#1e1811;
    --surface-2:#251e15;
    --gold:#c8a05a;
    --gold-soft:#a9834a;
    --cream:#f5efe4;
    --muted:#a89b83;
    --hair:rgba(200,160,90,.18);
    --radius:20px;
    --safe-top:env(safe-area-inset-top,0);
    --safe-bot:env(safe-area-inset-bottom,0);
  }

  *{box-sizing:border-box;margin:0;padding:0;}

  html{-webkit-tap-highlight-color:transparent;scroll-behavior:smooth;}

  ::selection{background:var(--gold);color:#1a1409;}

  body{
    background:
      radial-gradient(120% 60% at 50% -10%, #241c13 0%, var(--bg) 55%),
      var(--bg);
    color:var(--cream);
    font-family:'Manrope',sans-serif;
    font-size:16px;
    line-height:1.5;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:calc(48px + var(--safe-top)) 18px calc(80px + var(--safe-bot));
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  .card{
    width:100%;
    max-width:420px;
    animation:fadeUp .5s ease both;
  }
  @keyframes fadeUp{
    from{opacity:0;transform:translateY(8px);}
    to{opacity:1;transform:translateY(0);}
  }

  /* ---------- Avatar / medallion ---------- */
  .medallion-wrap{
    display:flex;
    justify-content:center;
    margin-bottom:22px;
    position:relative;
  }
  .medallion-wrap::before{
    content:"";
    position:absolute;
    top:50%;
    left:50%;
    width:340px;
    height:340px;
    transform:translate(-50%,-50%);
    background:radial-gradient(closest-side, rgba(200,160,90,.18), rgba(200,160,90,.06) 55%, transparent 75%);
    pointer-events:none;
    z-index:0;
  }
  .medallion{
    position:relative;
    z-index:1;
    width:132px;
    height:132px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(155deg,#2a2116,#181209);
  }
  .medallion::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    border:6px solid var(--gold);
  }
  .medallion::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    box-shadow:0 12px 30px -10px rgba(200,160,90,.35);
  }
  .medallion span{
    font-family:'Cormorant Garamond',serif;
    font-weight:600;
    font-size:44px;
    letter-spacing:1px;
    color:var(--gold);
    position:relative;
    z-index:2;
  }
  .medallion-img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center center;
    border-radius:50%;
    position:relative;
    z-index:1;
    border:2px solid rgba(200, 160, 90, 0.4);
  }

  /* ---------- Name / role ---------- */
  .identity{
    text-align:center;
    margin-bottom:20px;
  }
  .identity h1{
    font-family:'Cormorant Garamond',serif;
    font-weight:600;
    font-size:38px;
    letter-spacing:.3px;
    color:var(--cream);
    line-height:1.1;
  }
  .identity .role{
    margin-top:8px;
    font-size:12px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:600;
  }

  .divider{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin:18px 0 20px;
  }
  .divider span{
    height:1px;
    width:34px;
    background:linear-gradient(90deg,transparent,var(--gold-soft));
  }
  .divider span.right{
    background:linear-gradient(90deg,var(--gold-soft),transparent);
  }
  .divider i{
    width:5px;height:5px;border-radius:50%;
    background:var(--gold);
    display:inline-block;
  }

  .tagline{
    text-align:center;
    font-size:14.5px;
    line-height:1.65;
    color:var(--muted);
    padding:0 12px;
    margin-bottom:28px;
  }

  /* ---------- Actions ---------- */
  .actions{
    display:flex;
    gap:10px;
    margin-bottom:20px;
  }
  .btn{
    border:none;
    cursor:pointer;
    font-family:'Manrope',sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    border-radius:999px;
    transition:transform .15s ease, filter .15s ease, background .2s ease, border-color .15s ease;
    text-decoration:none;
  }
  .btn:active{transform:scale(.97);}
  .btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

  .btn-primary{
    flex:1;
    background:linear-gradient(180deg,#d8b678,var(--gold));
    color:#1a1409;
    font-weight:700;
    font-size:14px;
    padding:14px 16px;
    letter-spacing:.3px;
  }
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-primary svg{width:17px;height:17px;stroke:#1a1409;}

  .btn-square{
    width:52px;
    height:52px;
    flex-shrink:0;
    background:var(--surface);
    border:1px solid var(--hair);
    border-radius:15px;
    color:var(--gold);
  }
  .btn-square svg{width:20px;height:20px;}
  .btn-square:hover{background:var(--surface-2);}

  .btn-qr{
    width:72px;
    height:52px;
    padding:6px 8px;
    flex-direction:column;
    gap:2px;
    font-size:10px;
    font-weight:700;
    letter-spacing:.6px;
    text-transform:uppercase;
    color:var(--gold);
  }
  .btn-qr svg{width:18px;height:18px;transition:transform .2s ease;}
  .btn-qr-label{display:block;line-height:1;}
  .btn-qr[aria-expanded="true"]{background:var(--surface-2);border-color:var(--gold-soft);}
  .btn-qr[aria-expanded="true"] svg{transform:scale(.92);}

  /* ---------- QR panel ---------- */
  .qr-panel{
    max-height:0;
    overflow:hidden;
    transition:max-height .35s ease, opacity .3s ease, margin .35s ease;
    opacity:0;
    margin-bottom:0;
  }
  .qr-panel.open{
    max-height:380px;
    opacity:1;
    margin-bottom:20px;
  }
  .qr-inner{
    background:var(--surface);
    border:1px solid var(--hair);
    border-radius:var(--radius);
    padding:22px;
    text-align:center;
  }
  .qr-inner p{
    font-size:12px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:14px;
  }
  #qrcode{
    display:flex;
    justify-content:center;
    margin:0 auto 14px;
    background:var(--cream);
    padding:12px;
    border-radius:12px;
    width:fit-content;
  }
  #qrcode img,#qrcode canvas{display:block;border-radius:6px;}
  .copy-row{
    display:inline-flex;
    align-items:center;
    gap:8px;
    justify-content:center;
    font-size:12.5px;
    color:var(--gold);
    cursor:pointer;
    font-weight:600;
    background:none;
    border:none;
    font-family:inherit;
    padding:6px 10px;
    border-radius:8px;
    transition:background .15s ease;
  }
  .copy-row:hover{background:var(--surface-2);}
  .copy-row:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .copy-row svg{width:14px;height:14px;}

  /* ---------- Socials ---------- */
  .socials{
    display:flex;
    justify-content:center;
    gap:14px;
    margin-bottom:34px;
  }
  .social{
    width:48px;
    height:48px;
    border-radius:50%;
    background:var(--surface);
    border:1px solid var(--hair);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--gold);
    text-decoration:none;
    transition:background .2s ease, transform .15s ease, border-color .15s ease;
  }
  .social:hover{background:var(--surface-2);transform:translateY(-2px);border-color:var(--gold-soft);}
  .social:active{transform:translateY(0) scale(.96);}
  .social:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .social svg{width:24px;height:24px;}

  /* ---------- Section label ---------- */
  .section-label{
    font-size:11.5px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--gold-soft);
    margin-bottom:14px;
    padding-left:2px;
  }

  /* ---------- Salon cards ---------- */
  .salons{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-bottom:30px;
  }
  .salon{
    background:var(--surface);
    border:1px solid var(--hair);
    border-radius:16px;
    padding:16px;
    transition:background .15s ease, border-color .15s ease;
  }
  .salon:hover{background:var(--surface-2);border-color:var(--gold-soft);}
  .salon-top{
    display:flex;
    gap:12px;
    align-items:flex-start;
    margin-bottom:12px;
  }
  .salon-icon{
    width:34px;height:34px;
    border-radius:50%;
    background:var(--surface-2);
    display:flex;align-items:center;justify-content:center;
    color:var(--gold);
    flex-shrink:0;
  }
  .salon-icon svg{width:16px;height:16px;}
  .salon-text{flex:1;min-width:0;}
  .salon-text .town{
    font-weight:700;
    font-size:14.5px;
    color:var(--cream);
  }
  .salon-text .addr{
    font-size:13px;
    color:var(--muted);
    margin-top:2px;
  }
  .salon-actions{
    display:flex;
    gap:8px;
    padding-left:46px;
    flex-wrap:wrap;
  }
  .salon-actions a{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    font-weight:700;
    letter-spacing:.4px;
    color:var(--gold);
    text-decoration:none;
    padding:8px 12px;
    border-radius:10px;
    background:transparent;
    border:1px solid var(--hair);
    transition:background .15s ease, border-color .15s ease;
    min-height:36px;
  }
  .salon-actions a:hover{background:var(--surface-2);border-color:var(--gold-soft);}
  .salon-actions a:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .salon-actions a svg{width:13px;height:13px;transition:transform .15s ease;}
  .salon-actions a:hover svg{transform:translateX(2px);}

  /* ---------- Contact list ---------- */
  .contacts{
    display:flex;
    flex-direction:column;
    border:1px solid var(--hair);
    border-radius:16px;
    overflow:hidden;
    background:var(--surface);
  }
  .contact-row{
    display:flex;
    align-items:center;
    gap:13px;
    padding:15px 16px;
    text-decoration:none;
    color:var(--cream);
    border-bottom:1px solid var(--hair);
    transition:background .15s ease;
    min-height:48px;
  }
  .contact-row:last-child{border-bottom:none;}
  .contact-row:hover{background:var(--surface-2);}
  .contact-row:active{background:var(--surface-2);}
  .contact-row:focus-visible{outline:2px solid var(--gold);outline-offset:-2px;}
  .contact-row .ic{
    width:32px;height:32px;
    border-radius:50%;
    background:var(--surface-2);
    display:flex;align-items:center;justify-content:center;
    color:var(--gold);
    flex-shrink:0;
  }
  .contact-row .ic svg{width:15px;height:15px;}
  .contact-row .txt{font-size:14px;font-weight:500;flex:1;}
  .contact-row .txt small{
    display:block;
    font-size:10.5px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--muted);
    font-weight:700;
    margin-bottom:2px;
  }
  .contact-row .chev{
    color:var(--muted);
    flex-shrink:0;
    transition:transform .15s ease, color .15s ease;
  }
  .contact-row:hover .chev{color:var(--gold);transform:translateX(2px);}
  .contact-row .chev svg{width:14px;height:14px;}

  /* ---------- Small screen ---------- */
  @media (max-width:360px){
    .identity h1{font-size:32px;}
    .actions{flex-wrap:wrap;}
    .btn-primary{flex-basis:100%;}
    .btn-qr{flex:1;flex-direction:row;width:auto;}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important;}
  }
</style>
</head>
<body>

<div class="card">

  <div class="medallion-wrap">
    <div class="medallion"><img class="medallion-img" src="pino.jpg" alt="Pino Coiffeur" width="132" height="132" loading="lazy" decoding="async"></div>

    </button>
    <button class="btn btn-square btn-qr" id="qrToggle" type="button" aria-expanded="false" aria-controls="qrPanel" aria-label="Mostra QR code">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" wid[...]</svg>

      </div>
      <button type="button" class="copy-row" id="copyLink" aria-label="Copia il link della pagina">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/></svg>

      </button>
    </div>
  </div>

  <div class="socials">
    <a class="social" id="waSocial" href="https://wa.me/393394583024?text=Ciao%20Pino!%20Vorrei%20prenotare%20un%20appuntamento." target="_blank" rel="noopener" aria-label="Scrivici su WhatsApp">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M17.415 14.382C17.118 14.233 15.657 13.515 15.385 13.415C15.112 13.316 14.914 13.2[...]"/></svg>
    </a>
    <a class="social" href="https://www.instagram.com/_pinocoiffeur_?igsh=eXZqMXZhemh2dXVi" target="_blank" rel="noopener" aria-label="Instagram Pino Coiffeur">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/></svg>
    </a>
    <a class="social" href="https://www.facebook.com/share/1NqxHPWbj3/?mibextid=wwXIfr" target="_blank" rel="noopener" aria-label="Facebook Pino Coiffeur">
      <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.79[...]"/></svg>
    </a>
  </div>

  <div class="section-label">I nostri saloni</div>
  <div class="salons">

    <div class="salon">
      <div class="salon-top">
        <div class="salon-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/></svg>

        <div class="salon-text">
          <div class="town">Cropani Marina (CZ)</div>

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>

        <a id="callCropani" href="tel:+393394583024">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2"/></svg>

  <div class="section-label">Contatti</div>

      <span class="chev" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></s[...]>

</div>

<script>
(function(){
  // ---- vCard download ----
  document.getElementById('saveContact').addEventListener('click', function(){
    var vcard = [
      "BEGIN:VCARD",
      "VERSION:3.0",
      "N:Coiffeur;Pino;;;",
      "FN:Pino Coiffeur",
      "ORG:Pino Coiffeur",
      "TITLE:Parrucchiere",
      "TEL;TYPE=CELL,VOICE:+393394583024",
      "ADR;TYPE=WORK:;;Via Aurelia 13;Cropani Marina;CZ;;Italia",
      "ADR;TYPE=WORK:;;Via Nazionale 17;Scandale;KR;;Italia",
      "URL:https://www.instagram.com/_pinocoiffeur_",
      "URL:https://www.facebook.com/share/1NqxHPWbj3/",
      "END:VCARD"
    ].join("\r\n");
    var blob = new Blob([vcard], {type:"text/vcard;charset=utf-8"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = "pino-coiffeur.vcf";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 0);
  });

  // ---- QR toggle ----
  var qrToggle = document.getElementById('qrToggle');
  var qrPanel = document.getElementById('qrPanel');

  function setQrOpen(open){
    qrPanel.classList.toggle('open', open);
    qrToggle.setAttribute('aria-expanded', String(open));
    qrPanel.setAttribute('aria-hidden', String(!open));
  }

  qrToggle.addEventListener('click', function(){
    setQrOpen(qrPanel.getAttribute('aria-hidden') === 'true');
  });

  // ---- Copy link (with fallback for non-secure contexts) ----
  var copyBtn = document.getElementById('copyLink');
  var copyText = document.getElementById('copyText');
  var copyTimer;

  copyBtn.addEventListener('click', function(){
    var url = window.location.href;
    var done = function(){
      var original = copyText.textContent;
      copyText.textContent = "Link copiato ✓";
      clearTimeout(copyTimer);
      copyTimer = setTimeout(function(){ copyText.textContent = original; }, 1800);
    };
    var fail = function(){
      copyText.textContent = "Copia non riuscita";
      clearTimeout(copyTimer);
      copyTimer = setTimeout(function(){ copyText.textContent = "Copia link"; }, 1800);
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(url).then(done, fail);
    } else {
      try {
        var ta = document.createElement('textarea');
        ta.value = url;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '0';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy') ? done() : fail();
        document.body.removeChild(ta);
      } catch(e) { fail(); }
    }
  });
})();
</script>
